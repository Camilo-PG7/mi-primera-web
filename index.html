<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestor Peña | Perfil Profesional</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="card">
    <div class="status-badge">
      <span class="pulse"></span> Desplegado en Vercel
    </div>

    <div class="profile-img-container">
      <img src="https://www.fcbarcelonanoticias.com/wp-content/uploads/2025/05/cristiano-ronaldo-con-el-al-nassr-en-un-partido-ante-el-al-ittihad-en-la-saudi-pro-league.jpeg" alt="Nestor Peña" class="profile-img">
    </div>

    <h1>Nestor Peña</h1>
    
    <div class="tags">
      <span class="tag highlight">Ingeniería de Sistemas</span>
      <!-- Cambia el semestre según corresponda -->
      <span class="tag">8° Semestre</span>
    </div>

    <p class="description">
      Estudiante de Ingeniería de Sistemas apasionado por el desarrollo de software, arquitectura web y tecnologías Cloud.
    </p>

    <!-- Sección de Habilidades / Tecnologías -->
    <div class="skills-section">
      <h3>Habilidades & Tecnologías</h3>
      <div class="skills-grid">
        <span class="skill-pill">HTML5 & CSS3</span>
        <span class="skill-pill">Git & GitHub</span>
        <span class="skill-pill">Cloud Computing</span>
        <span class="skill-pill">Linux</span>
        <span class="skill-pill">Vercel</span>
      </div>
    </div>

    <div class="actions">
      <a href="https://github.com/Camilo-PG7" target="_blank" class="btn btn-primary">GitHub</a>
      <!-- Reemplaza con tu enlace de LinkedIn o mantén el correo -->
      <a href="https://linkedin.com" target="_blank" class="btn btn-secondary">LinkedIn</a>
    </div>
  </main>

</body>
</html>
